[package]
name = "pgterm"
version = "0.1.2"
edition = "2021"
description = "htop for all your Postgres databases — a multi-database terminal UI powered by pgbot"
license = "Apache-2.0"
homepage = "https://pgterm.dev"

# fake-pgbot is a test fixture; declaring it as a bin gives the integration
# tests CARGO_BIN_EXE_fake-pgbot. The release workflow packages only pgterm.
[[bin]]
name = "pgterm"
path = "src/main.rs"

[[bin]]
name = "fake-pgbot"
path = "tests/bin/fake_pgbot.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
dirs = "6"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
toml = "1"

[profile.release]
strip = true
lto = true
