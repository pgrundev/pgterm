name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only — no cross-linking risk. Linux is musl/static
          # so one binary runs on any distro, matching how pgbot ships.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          staging="pgterm_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/pgterm" README.md LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.os }}-${{ matrix.arch }}
          path: pgterm_*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum pgterm_*.tar.gz > checksums.txt
          cat checksums.txt
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pgterm $GITHUB_REF_NAME" \
            --generate-notes \
            dist/pgterm_*.tar.gz dist/checksums.txt

  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: download, verify, run --version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          case "$(uname -s)" in Darwin) os=darwin;; *) os=linux;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64;; *) arch=amd64;; esac
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "pgterm_${VERSION}_${os}_${arch}.tar.gz" --pattern checksums.txt
          if command -v sha256sum >/dev/null; then
            grep "pgterm_${VERSION}_${os}_${arch}.tar.gz" checksums.txt | sha256sum -c -
          else
            grep "pgterm_${VERSION}_${os}_${arch}.tar.gz" checksums.txt | shasum -a 256 -c -
          fi
          tar -xzf "pgterm_${VERSION}_${os}_${arch}.tar.gz"
          out="$("pgterm_${VERSION}_${os}_${arch}/pgterm" --version)"
          echo "$out"
          [ "$out" = "pgterm ${VERSION}" ] || { echo "version mismatch"; exit 1; }
